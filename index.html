<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATID | SWGRHyF - Inicio de Sesión</title>
    <!-- Vinculamos la hoja de estilos -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">

    <!-- Franja superior institucional -->
    <header class="login-header">
        <h1>ATID | SWGRHyF</h1>
        <p>Inicio de sesión - Simulación de Roles</p>
    </header>

    <!-- Contenedor Principal del Login -->
    <main class="login-main-container">
        
        <!-- Logotipo central institucional -->
        <div class="login-logo-container">
            <div class="logo-circle">
                <img src="Imagenes/Logo ATID.jpg" alt="Logotipo ATID" class="logo-img">
            </div>
        </div>

        <!-- Caja central de Autenticación -->
        <section class="login-box">
            <h2>Iniciar Sesión</h2>
            
            <!-- Formulario de acceso simulado -->
            <form id="loginForm">
                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Ej. admin_ti, rh_user..." required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Contraseña" required autocomplete="current-password">
                </div>

                <!-- Alerta de error si las credenciales fallan -->
                <div id="error-message" class="error-msg" style="display: none;">
                    Usuario o contraseña incorrectos.
                </div>

                <div class="form-footer">
                    <a href="#" class="forgot-link">¿Olvidó su contraseña?</a>
                </div>

                <button type="submit" class="btn-ingresar">INGRESAR</button>
            </form>

            <!-- Credenciales de ayuda visual para la simulación -->
            <div class="demo-credentials">
                <p><strong>Credenciales de prueba:</strong></p>
                <small>
                    • <strong>Superusuario:</strong> admin_ti / 1234<br>
                    • <strong>Personal RH:</strong> rh_user / 1234<br>
                    • <strong>Mando Medio:</strong> jefe_area / 1234<br>
                    • <strong>Empleado:</strong> empleado / 1234
                </small>
            </div>
        </section>

    </main>

    <!-- Vinculamos la lógica de simulación de usuarios -->
    <script src="login.js"></script>
</body>
</html>
